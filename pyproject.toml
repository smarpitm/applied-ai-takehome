[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-takehome"
version = "0.1.0"
description = "Cost-Efficient RAG (LanceDB + Qdrant) and Bias-Aware LLM-as-Judge Evaluation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "pyyaml>=6.0.2",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "lancedb>=0.15.0",
    "pyarrow>=17.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.3",
    "tiktoken>=0.8.0",
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "problem1_rag*", "problem2_judge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
